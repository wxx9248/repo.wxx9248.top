# Weekly update pull requests, one per ecosystem for minor and patch updates;
# major updates get their own. The cooldown matches pnpm's minimumReleaseAge:
# no releases younger than a day.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Dependency Updates"
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # vue-tsc and typescript-eslint still need TypeScript's JS compiler API
      # (typescript/lib/tsc), which TypeScript 7 (the native port) no longer
      # ships.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /repo/archlinux/index/
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Dependency Updates"
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "GitHub Actions Updates"
    groups:
      github-actions:
        update-types: [minor, patch]
